<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кое-что особенное для тебя</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Основная карточка */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 75, 110, 0.2);
            text-align: center;
            max-width: 480px;
            width: 90%;
            z-index: 10;
            border: 2px solid #fff;
            transition: all 0.5s ease;
        }

        h1 {
            color: #ff4b6e;
            font-size: 2rem;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .compliment {
            color: #4a4a4a;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Контейнер для кнопок викторины */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Кнопки ответов */
        .option-btn {
            background: white;
            color: #ff4b6e;
            border: 2px solid #ffccd5;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover {
            background: #ffe5ec;
            border-color: #ff4b6e;
            transform: translateY(-2px);
        }

        /* Стили для неправильного ответа */
        .option-btn.wrong {
            background: #f0f0f0;
            color: #a0a0a0;
            border-color: #d0d0d0;
            transform: none;
            cursor: not-allowed;
        }

        /* Стили для главного экрана (финал) */
        .btn-main {
            background: #ff4b6e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
            margin-top: 15px;
        }

        .btn-main:hover {
            background: #ff2a55;
            transform: scale(1.05);
        }

        /* Анимация тряски при ошибке */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Сердечки */
        .heart {
            position: absolute;
            color: #ff758f;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) scale(1) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="quiz-card">
        <h1 id="question-text">Загрузка вопроса...</h1>
        <div class="options-container" id="options-box">
            <!-- Кнопки вставит JavaScript -->
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Когда мы начали встречаться?",
                options: [
                    { text: "01.05.2025", isCorrect: false },
                    { text: "07.06.2025", isCorrect: true },
                    { text: "14.02.2025", isCorrect: false },
                    { text: "27.06.2025", isCorrect: false }
                ]
            },
            {
                question: "Куда я водил тебя в центре летом?",
                options: [
                    { text: "В ресторан", isCorrect: false },
                    { text: "В парк", isCorrect: false },
                    { text: "На камушек с видом на реку Днепр", isCorrect: true },
                    { text: "В кино на последний ряд", isCorrect: false }
                ]
            }
        ];

        const надписи = [
            "Ты - самый близкий для меня человек!",
            "Пусть твой день будет наполнен радостью и уютом!",
            "Кто то прямо сейчас думает о тебе с теплотой.",
            "У тебя очен красивая улыбка, улыбайся чаще!",
            "Ты очень милая и красивая!",
            "Спасибо, что ты есть!",
            "Всё обязательно получится, я верю в тебя!"
        ];

        let currentQuestionIndex = 0;
        let complimentIndex = 0;
        const видыСердечек = ['❤️', '💖', '💝', '💕', '💗', '💓'];

        const card = document.getElementById('quiz-card');
        const questionText = document.getElementById('question-text');
        const optionsBox = document.getElementById('options-box');

        function loadQuestion() {
            if (currentQuestionIndex >= quizData.length) {
                showFinalScreen();
                return;
            }

            const currentData = quizData[currentQuestionIndex];
            questionText.innerText = currentData.question;
            optionsBox.innerHTML = "";

            const shuffledOptions = [...currentData.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                button.innerText = option.text;
                button.onclick = () => handleAnswer(button, option.isCorrect);
                optionsBox.appendChild(button);
            });
        }

        function handleAnswer(button, isCorrect) {
            if (button.classList.contains('wrong')) return;

            if (isCorrect) {
                for (let i = 0; i < 30; i++) {
                    создатьСердечко(true);
                }
                
                card.style.opacity = 0;
                card.style.transform = "scale(0.9)";
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                    card.style.opacity = 1;
                    card.style.transform = "scale(1)";
                }, 500);

            } else {
                button.classList.add('wrong');
                card.classList.add('shake');
                setTimeout(() => {
                    card.classList.remove('shake');
                }, 400);
            }
        }

function showFinalScreen() {
            card.innerHTML = `
                <h1>Ура! Ты прошла викторину!</h1>
                <p class="compliment" id="text-box">Ты заслуживаешь всего самого лучшего в этом мире!</p>
                
                <div style="margin-bottom: 20px; border-radius: 15px; overflow: hidden; position: relative; padding-bottom: 177.77%; height: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                        src="https://www.youtube.com/embed/QAO2XPMLAM0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>

                <button class="btn-main" onclick="сменитьНадпись()">Нажми для улыбки</button>
            `;
            
            setInterval(() => создатьСердечко(false), 300);
        }
        function сменитьНадпись() {
            const textBox = document.getElementById('text-box');
            textBox.style.opacity = 0;
            
            setTimeout(() => {
                textBox.innerText = надписи[complimentIndex];
                textBox.style.opacity = 1;
                complimentIndex = (complimentIndex + 1) % надписи.length;
            }, 200);

            for (let i = 0; i < 15; i++) {
                создатьСердечко(true);
            }
        }

        function создатьСердечко(изЦентра = false) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = видыСердечек[Math.floor(Math.random() * видыСердечек.length)];
            
            const размер = Math.random() * 20 + 15;
            heart.style.fontSize = `${размер}px`;
            
            if (изЦентра) {
                heart.style.left = (window.innerWidth / 2 + (Math.random() * 240 - 120)) + 'px';
                heart.style.top = (window.innerHeight / 2 + (Math.random() * 240 - 120)) + 'px';
            } else {
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
            }

            const время = Math.random() * 3 + 3;
            heart.style.animationDuration = `${время}s`;

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, время * 1000);
        }

        setInterval(() => {
            if (currentQuestionIndex < quizData.length) {
                создатьСердечко(false);
            }
        }, 1200);

        loadQuestion();
    </script>

</body>
</html>
